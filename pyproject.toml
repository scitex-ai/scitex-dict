[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-dict"
version = "0.1.8"
description = "Dictionary utilities (DotDict, safe_merge) for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Three-tier dependency policy
# (see scitex/general/05_development_11_dependency-tiers.md).
#
# [project.dependencies]                     — hard runtime deps required
#                                              by every public surface
#                                              (Python API / CLI / MCP /
#                                              Skills) on a bare
#                                              `pip install scitex-dict`.
# [project.optional-dependencies.all]        — graceful-degradation
#                                              features (`pip install
#                                              scitex-dict[all]`).
# [project.optional-dependencies.dev]        — maintainer-only tools
#                                              (`pip install
#                                              scitex-dict[dev]`).
#
# scitex-dict is pure-Python (stdlib only) and ships no CLI or MCP
# server (cli=0, mcp=0 in SKILL.md). The only ecosystem-mandated hard
# dep is `scitex-dev`, which registers the `scitex_dev.skills` and
# `scitex_dev.docs` entry-points that this package publishes — without
# it the Skills surface is non-functional after a bare install.
dependencies = [
    "scitex-dev>=0.11.7",
    "scitex-logging>=0.1.0",
]

[project.optional-dependencies]
# Pure-stdlib package with no runtime extras; [all] maps to [dev]
# so `pip install scitex-dict[all]` stays functional (PS-214/215).
all = [
    "scitex-dict[dev]",
]

dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    # Sphinx toolchain (was [docs]; collapsed into [dev] because docs
    # are built by maintainers, not consumers — no runtime surface
    # depends on them).
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dict"
Repository = "https://github.com/ywatanabe1989/scitex-dict"
Issues = "https://github.com/ywatanabe1989/scitex-dict/issues"
Documentation = "https://scitex-dict.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-dict = "scitex_dict"

[project.entry-points."scitex_dev.skills"]
scitex-dict = "scitex_dict"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_dict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast CLI happy-path tests (<60s, runs on every PR)",
    "e2e: end-to-end workflows against real subsystems (mandatory on every PR)",
]

[tool.scitex_dev]
no_cli = true

[tool.coverage.run]
parallel = true
source = ["scitex_dict"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
