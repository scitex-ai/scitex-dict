# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    # The sphinx toolchain is the PEP 735 `docs` dependency group in
    # pyproject.toml (the single source; CI installs the same group).
    # RTD's `python.install` cannot install a group, so install it here;
    # `pip install --group` needs pip >= 25.1.
    post_install:
      - python -m pip install --upgrade "pip>=25.1"
      - python -m pip install -e . --group docs

sphinx:
  configuration: docs/sphinx/conf.py
  fail_on_warning: false

# Disable PDF/ePub to avoid multi-file output errors
formats: []
